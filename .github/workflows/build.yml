name: Build

# Compila o app e roda os testes a cada push e a cada pull request.
#
# O workflow de Release só dispara em tag (ou execução manual), então sem
# este aqui um commit pode chegar ao master sem nunca ter sido compilado —
# foi o que aconteceu na v1.15, cujos erros de recurso só apareceram depois.
# Tags não entram aqui: o filtro de branches já as exclui, e quem compila
# release é o release.yml.
on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

# Um push novo na mesma ref cancela a execução anterior, que já está obsoleta.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # assembleDebug não precisa do keystore e já roda o aapt2 em todos os
      # recursos, que é onde moram os erros de ícone/drawable.
      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Rodar testes unitários
        run: ./gradlew testDebugUnitTest --stacktrace

      # Sem os secrets do keystore o APK sai sem assinatura, o que não importa
      # aqui: o que interessa é o dex já minificado pelo R8, igual ao que vai
      # para a loja. Também cobre erros de R8/proguard, que o debug não pega.
      - name: Compilar APK de release (sem assinatura)
        run: ./gradlew assembleRelease --stacktrace

      # A Play Console recusa/adverte apps que chamam as APIs antigas de
      # edge-to-edge. Elas não vêm do tema, e sim de dentro do
      # enableEdgeToEdge() do androidx.activity — ver o comentário em
      # MainActivity.onCreate. Falha aqui se alguém reintroduzir a chamada.
      - name: Conferir ausência de APIs descontinuadas de edge-to-edge
        run: |
          APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -n1)
          echo "Analisando $APK"
          rm -rf /tmp/dexcheck && mkdir -p /tmp/dexcheck
          unzip -o -q "$APK" '*.dex' -d /tmp/dexcheck
          FOUND=""
          for api in setStatusBarColor setNavigationBarColor \
                     setDecorFitsSystemWindows setNavigationBarContrastEnforced \
                     setSystemUiVisibility; do
            if grep -qa "$api" /tmp/dexcheck/*.dex; then
              FOUND="$FOUND $api"
            fi
          done
          if [ -n "$FOUND" ]; then
            echo "::error::O APK de release ainda referencia APIs descontinuadas de edge-to-edge:$FOUND"
            exit 1
          fi
          echo "OK: nenhuma API descontinuada de edge-to-edge no dex."

      - name: Publicar relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
