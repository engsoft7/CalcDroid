name: Promover versão na Play

# Move a versão mais recente de uma faixa para outra (ex.: teste interno ->
# produção), com as mesmas notas, sem reenviar o AAB.
# Para produção, a conta de serviço precisa da permissão "Enviar para
# produção, excluir dispositivos e usar a Assinatura de apps" no Play Console.
on:
  workflow_dispatch:
    inputs:
      de:
        description: "Faixa de origem"
        type: choice
        options: [internal, alpha, beta]
        default: internal
      para:
        description: "Faixa de destino"
        type: choice
        options: [production, beta, alpha]
        default: production
      porcentagem:
        description: "Porcentagem de usuários (1-99 para lançamento gradual; 100 = todos)"
        default: "100"

permissions:
  contents: read

concurrency:
  group: play-edit
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cliente da Play API
        run: pip install -r tools/requirements-play.txt

      - name: Promover
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          DE: ${{ github.event.inputs.de }}
          PARA: ${{ github.event.inputs.para }}
          PCT: ${{ github.event.inputs.porcentagem }}
        run: |
          case "$PCT" in
            ''|*[!0-9]*) echo "::error::Porcentagem invalida: '$PCT' (use um numero de 1 a 100)."; exit 1 ;;
          esac
          if [ "$PCT" -lt 1 ] || [ "$PCT" -gt 100 ]; then
            echo "::error::Porcentagem precisa estar entre 1 e 100."; exit 1
          fi
          ARGS="--from $DE --to $PARA"
          if [ "$PCT" -lt 100 ]; then
            ARGS="$ARGS --rollout $(python3 -c "print($PCT/100)")"
          fi
          python3 tools/play_promote.py $ARGS
