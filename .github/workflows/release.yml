name: Release

# Ao criar uma tag v* (ex.: v1.0), compila o APK e o AAB de release, anexa os
# dois na Release do GitHub e envia o AAB para a Play Store (direto para
# produção por padrão; ver README). Também pode ser disparado manualmente (aba
# Actions > Release > Run workflow) informando a tag, que é criada junto com
# a release, e a faixa da Play.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.0)"
        required: true
      play_track:
        description: "Faixa da Play Store para o AAB (none = não enviar)"
        type: choice
        options:
          - production
          - internal
          - alpha
          - beta
          - none
        default: production

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Impressão digital da chave de upload que o Play Console exige para
      # este app. Um bundle assinado com outra chave é recusado no envio, e
      # o erro só aparece lá — por isso a conferência acontece aqui.
      # Se a chave de upload for redefinida no Play Console, troque o valor.
      EXPECTED_UPLOAD_SHA1: "71:EF:0A:75:54:F4:79:E8:A4:60:A0:C5:58:45:2B:86:C8:04:CA:A3"
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Faixa da Play: a escolhida na execução manual; num push de tag, a
      # variável de repositório PLAY_TRACK (Settings > Secrets and variables >
      # Actions > Variables), ou "production" se ela não existir.
      PLAY_TRACK: ${{ github.event.inputs.play_track || vars.PLAY_TRACK || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A Play recusa um versionCode já usado, e o nome dos arquivos sai da
      # tag; uma tag que não bate com o versionName quase sempre é esquecimento
      # de atualizar o app/build.gradle.kts.
      - name: Conferir versão
        run: |
          NAME=$(sed -n 's/^ *versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -n 's/^ *versionCode *= *\([0-9]*\).*/\1/p' app/build.gradle.kts)
          echo "Tag: $RELEASE_TAG | versionName: $NAME | versionCode: $CODE"
          if [ "v$NAME" != "$RELEASE_TAG" ]; then
            echo "::warning::A tag $RELEASE_TAG nao corresponde ao versionName \"$NAME\" do app/build.gradle.kts. Lembre de incrementar versionCode e versionName antes de criar a tag."
          fi

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Cache open source do GitHub Actions; o padrão da v6 é um serviço comercial.
          cache-provider: basic

      # Secrets do repositório (Settings > Secrets and variables > Actions):
      #   KEYSTORE_BASE64   - o .jks inteiro em base64 (recomendado)
      #   KEYSTORE_PASSWORD - senha do keystore
      #   KEY_ALIAS         - alias da chave
      #   KEY_PASSWORD      - senha da chave
      #
      # Preferimos KEYSTORE_BASE64 porque este repositório é público: o
      # arquivo .github/calcdroid-upload.jks.enc pode ser baixado por
      # qualquer um, e só a senha do AES o protege contra quebra offline.
      # Com a chave num secret, nada dela fica exposto. O caminho do .enc
      # segue funcionando para não quebrar quem ainda o usa.
      # Sem nenhum dos dois, o build sai sem assinatura (útil para CI).
      - name: Restaurar keystore de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Usando o keystore do secret KEYSTORE_BASE64."
            if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > calcdroid-upload.jks; then
              echo "::error::KEYSTORE_BASE64 nao e base64 valido. Gere com: base64 -w0 SEU_KEYSTORE.jks"
              exit 1
            fi
          elif [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_BASE64 ausente; caindo para o keystore criptografado no repositorio."
            if ! openssl enc -d -aes-256-cbc -pbkdf2 \
                -in .github/calcdroid-upload.jks.enc -out calcdroid-upload.jks \
                -pass env:KEYSTORE_PASSWORD; then
              echo "::error::Falha ao descriptografar o keystore. A senha precisa ser a mesma usada para criptografar o .enc — trocar o secret nao troca o arquivo. Prefira definir KEYSTORE_BASE64."
              exit 1
            fi
          else
            echo "::warning::Secrets do keystore ausentes; o APK sairá sem assinatura."
            exit 0
          fi
          # Falha cedo, com mensagem clara, se o keystore ou as senhas estiverem errados.
          if ! keytool -list -keystore calcdroid-upload.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::Keystore ou senhas inválidos; confira os secrets KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD."
            exit 1
          fi
          cat > keystore.properties <<EOF
          storeFile=calcdroid-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # O APK é o que se instala direto no aparelho; o AAB é o que se envia
      # no Play Console (o Google recusa APK em atualização de app novo e
      # reassina o bundle com a chave de app signing).
      - name: Compilar APK e AAB de release
        run: ./gradlew assembleRelease bundleRelease

      - name: Preparar artefatos
        id: artefatos
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -n1)
          cp "$APK" "CalcDroid-${RELEASE_TAG}.apk"

          AAB=$(ls app/build/outputs/bundle/release/app-release*.aab | head -n1)
          cp "$AAB" "CalcDroid-${RELEASE_TAG}.aab"

          # Sem os secrets o build sai sem assinatura de propósito (ver acima).
          # Com os secrets, não basta estar assinado: precisa ser a chave de
          # upload certa, senão o Play Console recusa o envio.
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            SIG=$(unzip -Z1 "$AAB" 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 2>/dev/null | head -n1)
            if [ -z "$SIG" ]; then
              echo "::error::O AAB saiu sem assinatura; confira os secrets KEYSTORE_*."
              exit 1
            fi
            unzip -p "$AAB" "$SIG" > /tmp/upload-sig.p7
            ATUAL=$(openssl pkcs7 -inform DER -in /tmp/upload-sig.p7 -print_certs \
                    | openssl x509 -noout -fingerprint -sha1 | sed 's/.*=//')
            echo "Impressao digital do AAB: $ATUAL"
            echo "Esperada pelo Play      : $EXPECTED_UPLOAD_SHA1"
            # Chave diferente não impede a Release do GitHub (o APK continua
            # instalável); só o envio para a Play, que ela recusaria.
            if [ "$ATUAL" != "$EXPECTED_UPLOAD_SHA1" ]; then
              echo "::warning::O AAB foi assinado com uma chave diferente da chave de upload registrada na Play ($EXPECTED_UPLOAD_SHA1). A Release do GitHub sai normalmente, mas o envio para a Play fica bloqueado. Veja 'Chave de upload diferente' no README."
            else
              echo "OK: assinado com a chave de upload esperada."
              echo "chave_play_ok=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publicar na Release do GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            CalcDroid-*.apk
            CalcDroid-*.aab
          generate_release_notes: true

      # Envio para a Play Store pela Google Play Developer API. Só acontece com
      # o secret PLAY_SERVICE_ACCOUNT_JSON (chave JSON de uma conta de serviço
      # convidada no Play Console — passo a passo no README); sem ele, o
      # workflow continua só publicando no GitHub, como antes.
      - name: Preparar envio para a Play Store
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHAVE_PLAY_OK: ${{ steps.artefatos.outputs.chave_play_ok }}
        run: |
          if [ "$PLAY_TRACK" = "none" ]; then
            echo "Envio para a Play desligado nesta execucao (faixa: none)."
            exit 0
          fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Secret PLAY_SERVICE_ACCOUNT_JSON ausente; o AAB nao foi enviado a Play Store. Veja a secao 'Envio automatico para a Play Store' do README."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Ha credencial da Play, mas o AAB saiu sem assinatura (secrets KEYSTORE_* ausentes). A Play so aceita o AAB assinado com a chave de upload."
            exit 1
          fi
          if [ "$CHAVE_PLAY_OK" != "true" ]; then
            echo "::error::A Release do GitHub foi publicada, mas o AAB nao foi enviado a Play: ele foi assinado com uma chave diferente da chave de upload registrada no Play Console ($EXPECTED_UPLOAD_SHA1). Veja 'Chave de upload diferente' no README."
            exit 1
          fi
          if ! printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | jq -e '.type == "service_account" and (.client_email | length > 0) and (.private_key | length > 0)' > /dev/null 2>&1; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON nao e a chave JSON de uma conta de servico. Cole o conteudo inteiro do arquivo .json baixado no Google Cloud."
            exit 1
          fi
          case "$PLAY_TRACK" in
            internal|alpha|beta|production) ;;
            *) echo "::error::Faixa da Play invalida: '$PLAY_TRACK' (use internal, alpha, beta, production ou none)."; exit 1 ;;
          esac
          echo "Enviando CalcDroid-${RELEASE_TAG}.aab para a faixa '$PLAY_TRACK'."
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Action de terceiros fixada pelo hash do commit (v1.1.5): ela recebe a
      # chave da conta de serviço, então uma tag movida no repositório dela
      # não pode trocar o código que roda aqui.
      # O mapeamento do R8 não precisa ir junto: ele já vem dentro do AAB
      # (BUNDLE-METADATA/.../proguard.map) e a Play usa de lá.
      - name: Enviar AAB para a Play Store
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.engsoft7.calcdroid
          releaseFiles: CalcDroid-${{ env.RELEASE_TAG }}.aab
          track: ${{ env.PLAY_TRACK }}
          # "completed" publica na faixa assim que a revisão da Play aprovar.
          # Um app que ainda está em rascunho no Play Console só aceita
          # "draft": nesse caso defina a variável PLAY_RELEASE_STATUS=draft.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: play-store/whatsnew
