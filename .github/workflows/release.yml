name: Release

# Ao criar uma tag v* (ex.: v1.0), compila o APK de release e anexa o
# arquivo na Release do GitHub para download. Também pode ser disparado
# manualmente (aba Actions > Release > Run workflow) informando a tag,
# que é criada junto com a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Impressão digital da chave de upload que o Play Console exige para
      # este app. Um bundle assinado com outra chave é recusado no envio, e
      # o erro só aparece lá — por isso a conferência acontece aqui.
      # Se a chave de upload for redefinida no Play Console, troque o valor.
      EXPECTED_UPLOAD_SHA1: "71:EF:0A:75:54:F4:79:E8:A4:60:A0:C5:58:45:2B:86:C8:04:CA:A3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # O keystore fica criptografado no repositório em
      # .github/calcdroid-upload.jks.enc (AES-256) e é descriptografado com
      # os secrets do repositório (Settings > Secrets and variables > Actions):
      #   KEYSTORE_PASSWORD - senha do keystore (também descriptografa o .enc)
      #   KEY_ALIAS         - alias da chave (ex.: calcdroid-upload)
      #   KEY_PASSWORD      - senha da chave
      # Sem os secrets, o APK é gerado sem assinatura (não instalável).
      - name: Restaurar keystore de assinatura
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secrets do keystore ausentes; o APK sairá sem assinatura."
            exit 0
          fi
          if ! openssl enc -d -aes-256-cbc -pbkdf2 \
              -in .github/calcdroid-upload.jks.enc -out calcdroid-upload.jks \
              -pass env:KEYSTORE_PASSWORD; then
            echo "::error::Falha ao descriptografar o keystore; confira o secret KEYSTORE_PASSWORD."
            exit 1
          fi
          # Falha cedo, com mensagem clara, se o keystore ou as senhas estiverem errados.
          if ! keytool -list -keystore calcdroid-upload.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::Keystore ou senhas inválidos; confira os secrets KEYSTORE_*."
            exit 1
          fi
          cat > keystore.properties <<EOF
          storeFile=calcdroid-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # O APK é o que se instala direto no aparelho; o AAB é o que se envia
      # no Play Console (o Google recusa APK em atualização de app novo e
      # reassina o bundle com a chave de app signing).
      - name: Compilar APK e AAB de release
        run: ./gradlew assembleRelease bundleRelease

      - name: Preparar artefatos
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APK=$(ls app/build/outputs/apk/release/app-release*.apk | head -n1)
          cp "$APK" "CalcDroid-${RELEASE_TAG}.apk"

          AAB=$(ls app/build/outputs/bundle/release/app-release*.aab | head -n1)
          cp "$AAB" "CalcDroid-${RELEASE_TAG}.aab"

          # Sem os secrets o build sai sem assinatura de propósito (ver acima).
          # Com os secrets, não basta estar assinado: precisa ser a chave de
          # upload certa, senão o Play Console recusa o envio.
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            SIG=$(unzip -Z1 "$AAB" 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 2>/dev/null | head -n1)
            if [ -z "$SIG" ]; then
              echo "::error::O AAB saiu sem assinatura; confira os secrets KEYSTORE_*."
              exit 1
            fi
            unzip -p "$AAB" "$SIG" > /tmp/upload-sig.p7
            ATUAL=$(openssl pkcs7 -inform DER -in /tmp/upload-sig.p7 -print_certs \
                    | openssl x509 -noout -fingerprint -sha1 | sed 's/.*=//')
            echo "Impressao digital do AAB: $ATUAL"
            echo "Esperada pelo Play      : $EXPECTED_UPLOAD_SHA1"
            if [ "$ATUAL" != "$EXPECTED_UPLOAD_SHA1" ]; then
              echo "::error::O AAB foi assinado com a chave errada. O Play Console vai recusar o envio. Verifique se .github/calcdroid-upload.jks.enc contem o keystore de upload correto e se os secrets KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD correspondem a ele."
              exit 1
            fi
            echo "OK: assinado com a chave de upload esperada."
          fi

      - name: Publicar na Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            CalcDroid-*.apk
            CalcDroid-*.aab
          generate_release_notes: true
